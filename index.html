<!doctype html>
<html lang="vi" class="">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#1b5ef5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <!-- Installable on the home screen (Android "Add to Home screen" / iOS). -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="VocabStudy" />
    <meta
      name="description"
      content="VocabStudy — Học & ôn từ vựng tiếng Anh cho người Việt: tự nhớ lại, lặp lại ngắt quãng (SRS), trò chơi và trợ lý AI."
    />
    <title>VocabStudy · Học từ vựng tiếng Anh</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E"
    />
    <!-- Start the 280 KB language pack in parallel with the JS bundle instead of
         after it: on mobile this is the biggest single win at startup. Relative
         href so it still resolves when the app is hosted under a sub-path. -->
    <link rel="preload" href="data/en.json" as="fetch" type="application/json" crossorigin />
    <!-- Prevent flash of wrong theme: apply saved theme before paint -->
    <script>
      ;(function () {
        try {
          var raw = localStorage.getItem('vocab.settings.v1')
          var theme = raw ? (JSON.parse(raw).state || {}).theme : null
          var dark =
            theme === 'dark' ||
            ((!theme || theme === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
