<!doctype html>
<html lang="vi" class="">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- Browser bar tinted like the top of the sky (pale morning / night). -->
    <meta name="theme-color" content="#dfe7f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)" />
    <!-- Installable on the home screen (Android "Add to Home screen" / iOS). -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="VocaStudy" />
    <meta
      name="description"
      content="VocaStudy — Học & ôn từ vựng tiếng Anh cho người Việt: tự nhớ lại, lặp lại ngắt quãng (SRS), trò chơi và trợ lý AI."
    />
    <title>VocaStudy · Học từ vựng tiếng Anh</title>
    <link rel="canonical" href="https://vocastudy.app/" />
    <!-- Link previews (Zalo, Messenger, Facebook, X). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VocaStudy" />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:url" content="https://vocastudy.app/" />
    <meta property="og:title" content="VocaStudy · Học từ vựng tiếng Anh" />
    <meta
      property="og:description"
      content="Hơn 3000 từ tiếng Anh thông dụng cho người Việt: tự nhớ lại, lặp lại ngắt quãng, trò chơi, luyện nói và trợ lý AI."
    />
    <meta property="og:image" content="https://vocastudy.app/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E"
    />
    <!-- Start the language pack (the largest download, ~430 KB compressed) in
         parallel with the JS bundle instead of after it: on mobile this is the
         biggest single win at startup. Relative href so it still resolves when
         the app is hosted under a sub-path. -->
    <link rel="preload" href="data/en.json" as="fetch" type="application/json" crossorigin />
    <!-- Prevent flash of wrong theme: apply saved theme before paint -->
    <script>
      ;(function () {
        try {
          var raw = localStorage.getItem('vocab.settings.v1')
          var theme = raw ? (JSON.parse(raw).state || {}).theme : null
          var dark =
            theme === 'dark' ||
            ((!theme || theme === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <noscript>
      <p style="padding: 2rem; font-family: system-ui, sans-serif; text-align: center">
        VocaStudy cần bật JavaScript để chạy. Hãy bật JavaScript trong trình duyệt rồi tải lại
        trang.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
