<!doctype html>
<html lang="vi" class="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#337dff" />
    <meta
      name="description"
      content="VocabStudy — Học & ôn 1000 từ vựng tiếng Anh thông dụng cho người Việt với flashcard, lặp lại ngắt quãng (SRS) và quiz."
    />
    <title>VocabStudy · Học từ vựng tiếng Anh</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E" />
    <!-- Prevent flash of wrong theme: apply saved theme before paint -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('vocab.settings.v1');
          var theme = raw ? (JSON.parse(raw).state || {}).theme : null;
          var dark =
            theme === 'dark' ||
            ((!theme || theme === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
