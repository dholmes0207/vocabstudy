<!doctype html>
<html lang="en" class="">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- Browser bar tinted like the top of the sky (pale morning / night). -->
    <meta name="theme-color" content="#dfe7f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)" />
    <!-- Installable on the home screen (Android "Add to Home screen" / iOS). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="VocaStudy" />
    <meta
      name="description"
      content="VocaStudy helps Vietnamese learners speak English with confidence: 4,400+ everyday words and 100 ready-to-use phrases with native audio, spaced repetition, games and an AI tutor. Free."
    />
    <title>VocaStudy · Speak English with confidence</title>
    <link rel="canonical" href="https://vocastudy.app/" />
    <!-- Link previews (Zalo, Messenger, Facebook, X). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VocaStudy" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="vi_VN" />
    <meta property="og:url" content="https://vocastudy.app/" />
    <meta
      property="og:title"
      content="VocaStudy · Speak English with confidence, a little every day"
    />
    <meta
      property="og:description"
      content="4,400+ everyday English words and 100 ready-to-use phrases with native audio and Vietnamese meanings: spaced repetition, games, speaking practice and an AI tutor."
    />
    <!-- Drawn by scripts/make_brand_assets.mjs, like the icons. -->
    <meta property="og:image" content="https://vocastudy.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="VocaStudy — Speak English with confidence, a little every day."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192" />
    <!-- Start the language pack (the largest download, ~430 KB compressed) in
         parallel with the JS bundle instead of after it: on mobile this is the
         biggest single win at startup. Absolute href: pages live at clean
         paths like /phrases/food. -->
    <link rel="preload" href="/data/en.json" as="fetch" type="application/json" crossorigin />
    <!-- Prevent flash of wrong theme: apply saved theme before paint -->
    <script>
      ;(function () {
        try {
          var raw = localStorage.getItem('vocab.settings.v1')
          var theme = raw ? (JSON.parse(raw).state || {}).theme : null
          var dark =
            theme === 'dark' ||
            ((!theme || theme === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <noscript>
      <p style="padding: 2rem; font-family: system-ui, sans-serif; text-align: center">
        VocaStudy needs JavaScript. Please enable it and reload the page. / VocaStudy cần bật
        JavaScript — hãy bật rồi tải lại trang.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
