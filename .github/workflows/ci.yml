name: CI

on:
  push:
    branches: [main]
  # Every PR, including ones stacked on another feature branch: their base is
  # not main, but they still have to pass the same checks before merging.
  pull_request:

# A new push to the same branch makes the previous run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Builds without VITE_SUPABASE_* on purpose: the app must still compile
      # and fall back to guest mode when Supabase is not configured.
      - name: Build
        run: npm run build

  # The main learning path in a real browser on the production build
  # (e2e/, docs/design/e2e.md): learn, reload, review days later, offline.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: End-to-end tests
        run: npm run e2e

      - name: Keep the trace of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-trace
          path: e2e/test-results/
          retention-days: 7
