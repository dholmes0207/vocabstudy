name: CI

# CI runs on GitHub Actions minutes, which this private repository pays for
# once the monthly free allowance is used up. It is kept lean on purpose
# (docs/design/ci.md):
# - pull requests only: PRs are squash-merged, so main gets a tree that was
#   already checked; "Run workflow" still starts it by hand on any branch;
# - a PR that only touches docs (docs/**, *.md) skips it;
# - one job, so checkout, install and the production build happen once and the
#   end-to-end tests reuse that build.
on:
  # Every PR, including ones stacked on another feature branch: their base is
  # not main, but they still have to pass the same checks before merging.
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

# A new push to the same branch makes the previous run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Test · Build · E2E
    # `playwright install --with-deps` must know the image's system libraries:
    # @playwright/test 1.65 covers Ubuntu 24.04 and 26.04. If a new
    # ubuntu-latest breaks that step, upgrade @playwright/test first.
    runs-on: ubuntu-latest
    # A normal run takes about 8 minutes; a stuck one should not eat the
    # allowance.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Builds without VITE_SUPABASE_* on purpose: the app must still compile
      # and fall back to guest mode when Supabase is not configured.
      - name: Build
        run: npm run build

      # The main learning path in a real browser on the production build just
      # made (e2e/, docs/design/e2e.md): learn, reload, review days later, offline.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e

      - name: Keep the trace of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-trace
          path: e2e/test-results/
          retention-days: 7
